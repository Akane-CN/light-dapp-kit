name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - name: scaffold smoke test
        run: |
          cd /tmp && node $GITHUB_WORKSPACE/packages/create-light-dapp/bin/index.js smoke-app --network=testnet --dao=y
          test -f smoke-app/src/pages/Dao.tsx
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: e2e/playwright-report }
  # Real testnet wallet flow (balance, DAO list, self-transfer) with a private-key signer.
  # Runs only on main. Defaults to the well-known public testnet key (0xee…ee) that
  # the CKB community shares for testing; set the TESTNET_PRIVATE_KEY secret to use
  # a dedicated one. The spec tops the address up from the faucet when it runs low.
  e2e-wallet:
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY || '0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee' }}
      TESTNET_FROM_BLOCK: ${{ vars.TESTNET_FROM_BLOCK }}
      TESTNET_EXPECT_DAO: ${{ vars.TESTNET_EXPECT_DAO }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e -- wallet.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report-wallet, path: e2e/playwright-report }
  # JoyID passkey wallet through the connector, driven by a CDP virtual authenticator.
  # Registers a JoyID testnet account per run, so it only runs on manual dispatch or when
  # a main-branch commit message contains "[joyid]". Screenshots, trace and video are
  # uploaded; the step summary carries the per-step log.
  e2e-joyid:
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[joyid]'))
    env:
      RUN_JOYID: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e -- joyid.spec.ts
      - name: step summary
        if: always()
        run: cat e2e/test-results/joyid-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary written (test aborted early; see artifacts)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joyid-report
          path: |
            e2e/playwright-report
            e2e/test-results
